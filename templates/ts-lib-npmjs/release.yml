name: Release

# Release CI, then version commit + tag + GitHub release (release-tag), then npmjs.com publish in
# THIS workflow: npm trusted publishing (OIDC) is bound to this file name and the "npm" environment.
# npmjs.com setup: package > Settings > Trusted publishing > GitHub Actions, workflow release.yml,
# environment npm. Provenance is added for public repositories.

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version part to raise
        type: choice
        options: [patch, minor, major, prerelease, prepatch, preminor, premajor]
        default: patch
      dry-run:
        description: Test, build and pack, but push, publish and release nothing
        type: boolean
        default: false

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      packages: read
      pull-requests: write
    with:
      stage: release
    secrets: inherit

  tag:
    needs: ci
    uses: boshold/gh-actions-public/.github/workflows/release-tag.yml@v1
    permissions:
      contents: write
    with:
      bump: ${{ inputs.bump }}
      dry-run: ${{ inputs.dry-run }}

  # Runs dependency code, so no id-token here. Hands the tarballs on in publish order.
  build:
    needs: tag
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      # A dry run has no pushed tag: build the branch and only pack.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.dry-run && github.ref || needs.tag.outputs.tag }}
          persist-credentials: false

      - uses: boshold/gh-actions-public/.github/actions/setup@v1
        with:
          registry: npmjs
          cache: "off"

      - name: Build
        shell: bash
        run: pnpm build

      # pnpm pack resolves workspace: ranges. List dependencies first (e.g. packages/core packages/cli).
      - name: Pack
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          for dir in .; do
            before=$(ls release)
            (cd "$dir" && pnpm pack --pack-destination "$GITHUB_WORKSPACE/release" >/dev/null)
            comm -13 <(echo "$before") <(ls release) >> release/order.txt
          done

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-release
          path: release/
          if-no-files-found: error
          retention-days: 1

  # Runs no dependency code. npm trusted publishing is bound to this file and the "npm" environment
  # (limit it to the default branch in the repository settings).
  publish:
    needs: [tag, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-release
          path: release

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - id: order
        shell: bash
        run: |
          set -euo pipefail
          { echo "packages<<EOF"; sed 's#^#release/#' release/order.txt; echo "EOF"; } >> "$GITHUB_OUTPUT"

      - uses: boshold/gh-actions-public/.github/actions/npm-publish@v1
        with:
          registry: npmjs
          packages: ${{ steps.order.outputs.packages }}
          version: ${{ needs.tag.outputs.version }}
          dry-run: ${{ inputs.dry-run }}
          # stage: "true"  # npm stage publish: approve on npmjs.com with 2FA
