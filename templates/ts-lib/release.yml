name: Release

# Release CI, then version commit + tag, GitHub release and GitHub Packages publish.

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version part to raise
        type: choice
        options: [patch, minor, major, prerelease, prepatch, preminor, premajor]
        default: patch
      dry-run:
        description: Test and build, but push, publish and release nothing
        type: boolean
        default: false

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      packages: read
      pull-requests: write
    with:
      stage: release
    secrets: inherit

  release:
    needs: ci
    uses: boshold/gh-actions-public/.github/workflows/release-npm.yml@v1
    permissions:
      contents: write
      packages: write
    with:
      bump: ${{ inputs.bump }}
      dry-run: ${{ inputs.dry-run }}
    secrets:
      packages-token: ${{ secrets.PACKAGES_READ_TOKEN }}
      # release-token: ${{ secrets.RELEASE_TOKEN }}  # GitHub App token for protected branches
