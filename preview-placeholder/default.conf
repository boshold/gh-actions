server {
    listen 3000;
    listen [::]:3000;
    server_name _;

    location = /api/health {
        default_type application/json;
        add_header Cache-Control "no-store";
        return 200 '{"status":"idle","previewAvailable":false}';
    }

    location / {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-store";
        try_files $uri /index.html;
    }
}
