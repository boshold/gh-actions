name: Image build
description: >-
  Builds a Docker image with buildx and a gha layer cache. Typical use: build with push false
  (loaded locally), smoke it, then call again with push true (cache hit) to publish.

inputs:
  context:
    default: "."
  dockerfile:
    description: Dockerfile path; empty is <context>/Dockerfile
    default: ""
  image:
    description: Image name without tag; empty is ghcr.io/<owner/repo lowercased>
    default: ""
  tags:
    description: Newline-separated tags; bare tags (sha-abc) are prefixed with image, full refs (with / or :) used as is. Empty is sha-<revision>
    default: ""
  build-args:
    description: Newline-separated KEY=VALUE build args
    default: ""
  platforms:
    description: Comma-separated platforms, e.g. linux/amd64,linux/arm64; empty is the runner platform
    default: ""
  push:
    default: "false"
  load:
    description: Load into the local Docker daemon; empty is true when push is false
    default: ""
  registry:
    description: Registry to log in to (on push, or when registry-password is set)
    default: ghcr.io
  registry-username:
    description: Empty is github.actor
    default: ""
  registry-password:
    description: Empty is github.token
    default: ""
  secret-token:
    description: Exposed as BuildKit secret id github_npm_token; empty is github.token
    default: ""
  revision:
    description: Build arg DEPLOYMENT_REVISION and OCI revision label; empty is the workflow sha
    default: ""
  version:
    description: Build arg APP_VERSION and OCI version label when set
    default: ""
  cache-scope:
    description: gha cache scope; empty derives from the Dockerfile path
    default: ""
  provenance:
    description: min, max or false (attestations only apply when pushing)
    default: min
  sbom:
    description: Attach an SBOM attestation when pushing
    default: "false"

outputs:
  digest:
    description: Image digest (pushed) or image id (loaded)
    value: ${{ steps.build.outputs.digest }}
  image:
    description: First full image reference
    value: ${{ steps.prepare.outputs.image }}
  refs:
    description: Newline-separated full image references
    value: ${{ steps.prepare.outputs.refs }}

runs:
  using: composite
  steps:
    - id: prepare
      shell: bash
      env:
        CONTEXT: ${{ inputs.context }}
        DOCKERFILE: ${{ inputs.dockerfile }}
        IMAGE: ${{ inputs.image }}
        TAGS: ${{ inputs.tags }}
        BUILD_ARGS: ${{ inputs.build-args }}
        PUSH: ${{ inputs.push }}
        LOAD: ${{ inputs.load }}
        REVISION: ${{ inputs.revision || github.sha }}
        VERSION: ${{ inputs.version }}
        CACHE_SCOPE: ${{ inputs.cache-scope }}
        PROVENANCE: ${{ inputs.provenance }}
        SBOM: ${{ inputs.sbom }}
      run: bash "$GITHUB_ACTION_PATH/prepare.sh"

    - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

    - if: inputs.push == 'true' || inputs.registry-password != ''
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      with:
        registry: ${{ inputs.registry }}
        username: ${{ inputs.registry-username || github.actor }}
        password: ${{ inputs.registry-password || github.token }}

    - id: build
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        context: ${{ inputs.context }}
        file: ${{ steps.prepare.outputs.dockerfile }}
        platforms: ${{ inputs.platforms }}
        push: ${{ inputs.push == 'true' }}
        load: ${{ steps.prepare.outputs.load == 'true' }}
        tags: ${{ steps.prepare.outputs.refs }}
        labels: ${{ steps.prepare.outputs.labels }}
        build-args: ${{ steps.prepare.outputs.build-args }}
        secrets: github_npm_token=${{ inputs.secret-token || github.token }}
        provenance: ${{ steps.prepare.outputs.provenance }}
        sbom: ${{ steps.prepare.outputs.sbom == 'true' }}
        cache-from: type=gha,scope=${{ steps.prepare.outputs.cache-scope }}
        cache-to: type=gha,mode=max,scope=${{ steps.prepare.outputs.cache-scope }}
