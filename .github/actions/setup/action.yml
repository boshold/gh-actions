name: Setup
description: pnpm + Node (+ optional Bun) with pnpm store cache, scoped registry auth and install.

inputs:
  node-version:
    description: Node.js version; empty reads .nvmrc, .node-version or package.json engines/volta in working-directory, else 24
    default: ""
  pnpm-version:
    description: pnpm version; empty reads the packageManager field of package.json
    default: ""
  registry:
    description: Registry for the scope, github (npm.pkg.github.com) or npmjs (registry.npmjs.org)
    default: github
  scope:
    description: npm scope authenticated against the registry; empty is @<repository owner> for github, none for npmjs
    default: ""
  token:
    description: Registry token for the install step; empty falls back to github.token for github, none for npmjs
    default: ""
  install-command:
    description: Install command run in working-directory; empty skips install
    default: pnpm install --frozen-lockfile
  working-directory:
    description: Directory holding package.json, the lockfile and version files
    default: "."
  bun:
    description: Bun version to install; "file" reads .bun-version in working-directory; empty skips Bun
    default: ""
  cache:
    description: auto (GitHub cache unless CI_LOCAL_CACHE=1 on the runner) or off
    default: auto

outputs:
  node-version:
    description: Installed Node.js version
    value: ${{ steps.node.outputs.node-version }}

runs:
  using: composite
  steps:
    - id: resolve
      shell: bash
      env:
        NODE_VERSION: ${{ inputs.node-version }}
        REGISTRY: ${{ inputs.registry }}
        SCOPE: ${{ inputs.scope }}
        HAS_TOKEN: ${{ inputs.token != '' }}
        CACHE: ${{ inputs.cache }}
        BUN: ${{ inputs.bun }}
        WORKDIR: ${{ inputs.working-directory }}
        OWNER: ${{ github.repository_owner }}
      run: bash "$GITHUB_ACTION_PATH/resolve.sh"

    - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      with:
        version: ${{ inputs.pnpm-version }}
        package_json_file: ${{ steps.resolve.outputs.package-json }}

    - id: node
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: ${{ steps.resolve.outputs.node-version }}
        node-version-file: ${{ steps.resolve.outputs.node-version-file }}
        cache: ${{ steps.resolve.outputs.node-cache }}
        package-manager-cache: ${{ steps.resolve.outputs.node-cache != '' }}
        cache-dependency-path: ${{ steps.resolve.outputs.lockfile }}
        registry-url: ${{ steps.resolve.outputs.registry-url }}
        scope: ${{ steps.resolve.outputs.scope }}

    - if: inputs.bun != ''
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version: ${{ steps.resolve.outputs.bun-version }}
        bun-version-file: ${{ steps.resolve.outputs.bun-version-file }}

    - name: Install dependencies
      if: inputs.install-command != ''
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        NODE_AUTH_TOKEN: ${{ inputs.token || (inputs.registry == 'github' && github.token) || '' }}
        CMD: ${{ inputs.install-command }}
      run: bash -euo pipefail -c "$CMD"
