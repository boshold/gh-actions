name: Release assets
description: Uploads files (and a SHA256SUMS file) to an existing GitHub release.

inputs:
  tag:
    description: Tag of the existing release
    required: true
  files:
    description: Newline-separated globs; each must match at least one file, basenames must be unique
    required: true
  checksums:
    description: Generate and upload SHA256SUMS for the files
    default: "true"
  clobber:
    description: Replace assets that already exist with the same name; false keeps them
    default: "true"
  working-directory:
    description: Directory the globs resolve against
    default: .
  token:
    description: Token with contents write
    default: ${{ github.token }}

outputs:
  uploaded:
    description: JSON array of uploaded asset names

runs:
  using: node24
  main: index.mjs
