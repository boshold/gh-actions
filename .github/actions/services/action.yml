name: Services
description: Starts Postgres (container or PGDG binaries), Mailpit and/or a compose file and waits until healthy.

inputs:
  postgres-version:
    description: Postgres image tag, e.g. "18", "17-alpine" or "18@sha256:…"; empty skips Postgres
    default: ""
  postgres-mode:
    description: container (docker run, health-checked) or binaries (PGDG server binaries on PATH, no cluster)
    default: container
  postgres-user:
    default: postgres
  postgres-password:
    default: postgres
  postgres-db:
    default: postgres
  postgres-port:
    description: Host port
    default: "5432"
  postgres-extra-databases:
    description: Comma or newline separated extra databases created after startup
    default: ""
  mailpit-version:
    description: Mailpit image tag, e.g. "v1.30" or "v1.30@sha256:…"; empty skips Mailpit
    default: ""
  mailpit-smtp-port:
    default: "1025"
  mailpit-http-port:
    default: "8025"
  compose-file:
    description: Optional docker compose file started with up --wait
    default: ""
  wait-seconds:
    description: Health wait per service
    default: "60"
  name-suffix:
    description: Container/project name suffix; empty is <run id>-<attempt>-<job>
    default: ""

outputs:
  database-url:
    description: postgresql:// URL of postgres-db (container mode only)
    value: ${{ steps.start.outputs.database-url }}
  postgres-container:
    value: ${{ steps.start.outputs.postgres-container }}
  mailpit-container:
    value: ${{ steps.start.outputs.mailpit-container }}
  compose-project:
    value: ${{ steps.start.outputs.compose-project }}

runs:
  using: composite
  steps:
    - id: start
      shell: bash
      env:
        POSTGRES_VERSION: ${{ inputs.postgres-version }}
        POSTGRES_MODE: ${{ inputs.postgres-mode }}
        POSTGRES_USER: ${{ inputs.postgres-user }}
        POSTGRES_PASSWORD: ${{ inputs.postgres-password }}
        POSTGRES_DB: ${{ inputs.postgres-db }}
        POSTGRES_PORT: ${{ inputs.postgres-port }}
        POSTGRES_EXTRA_DATABASES: ${{ inputs.postgres-extra-databases }}
        MAILPIT_VERSION: ${{ inputs.mailpit-version }}
        MAILPIT_SMTP_PORT: ${{ inputs.mailpit-smtp-port }}
        MAILPIT_HTTP_PORT: ${{ inputs.mailpit-http-port }}
        COMPOSE_FILE_INPUT: ${{ inputs.compose-file }}
        WAIT_SECONDS: ${{ inputs.wait-seconds }}
        NAME_SUFFIX: ${{ inputs.name-suffix }}
      run: bash "$GITHUB_ACTION_PATH/start.sh"
