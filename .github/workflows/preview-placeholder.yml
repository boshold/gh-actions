name: Preview placeholder image

# Builds the idle preview image (preview-placeholder/), proves it answers {"status":"idle"}, then
# pushes it (multi-platform). Pull requests build and smoke only. Callable for other owners that
# want their own copy under ghcr.io/<owner>/preview-placeholder.

on:
  push:
    branches: [main]
    paths:
      - preview-placeholder/**
      - .github/workflows/preview-placeholder.yml
  pull_request:
    paths:
      - preview-placeholder/**
      - .github/workflows/preview-placeholder.yml
  workflow_dispatch:
  workflow_call:
    inputs:
      image:
        type: string
        default: ""
        description: Image name without tag; empty is ghcr.io/<owner>/preview-placeholder
      push:
        type: string
        default: auto
        description: auto (push unless pull_request), true or false
      platforms:
        type: string
        default: linux/amd64,linux/arm64
      runner:
        type: string
        default: ""
    outputs:
      image:
        description: Pushed image pinned by digest
        value: ${{ jobs.image.outputs.image }}

permissions:
  contents: read

jobs:
  image:
    runs-on: ${{ inputs.runner || (github.event.repository.private && vars.CI_RUNNER_STANDARD) || 'ubuntu-latest' }}
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    env:
      PUSH: ${{ inputs.push != 'false' && (inputs.push == 'true' || github.event_name != 'pull_request') }}
    outputs:
      image: ${{ steps.push.outputs.digest && format('{0}@{1}', steps.name.outputs.image, steps.push.outputs.digest) || '' }}
    steps:
      # The source lives next to this workflow, also when another repository calls it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          sparse-checkout: preview-placeholder
          persist-credentials: false

      - id: name
        shell: bash
        env:
          IMAGE: ${{ inputs.image }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          image="${IMAGE:-ghcr.io/$OWNER/preview-placeholder}"
          echo "image=${image,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: preview-placeholder
          load: true
          tags: preview-placeholder:smoke
          cache-from: type=gha,scope=preview-placeholder
          cache-to: type=gha,mode=max,scope=preview-placeholder

      - name: Smoke
        shell: bash
        run: |
          set -euo pipefail
          name="preview-placeholder-smoke-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          docker rm -f "$name" >/dev/null 2>&1 || true
          trap 'docker logs "$name" || true; docker rm -f "$name" >/dev/null 2>&1 || true' EXIT
          docker run -d --name "$name" -p 127.0.0.1::3000 preview-placeholder:smoke >/dev/null
          port=$(docker port "$name" 3000/tcp | head -n 1 | sed 's/.*://')
          for _ in $(seq 1 30); do
            if health=$(curl -fsS --max-time 5 "http://127.0.0.1:$port/api/health"); then break; fi
            sleep 1
          done
          echo "health: ${health:-<none>}"
          [[ "$(jq -r .status <<< "${health:-null}")" == idle ]] || { echo "::error::health status is not idle"; exit 1; }
          curl -fsS --max-time 5 "http://127.0.0.1:$port/any/path" | grep -q "no preview" || { echo "::error::placeholder page missing"; exit 1; }

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: env.PUSH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Push
        id: push
        if: env.PUSH == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: preview-placeholder
          platforms: ${{ inputs.platforms || 'linux/amd64,linux/arm64' }}
          push: true
          provenance: mode=min
          tags: |
            ${{ steps.name.outputs.image }}:main
            ${{ steps.name.outputs.image }}:sha-${{ job.workflow_sha }}
          cache-from: type=gha,scope=preview-placeholder

      - name: Summary
        if: env.PUSH == 'true'
        shell: bash
        env:
          IMAGE: ${{ steps.name.outputs.image }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: echo "Pushed \`$IMAGE@$DIGEST\`" >> "$GITHUB_STEP_SUMMARY"
